<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32x32 高精細點陣彈珠跑馬燈 (文字緊湊排版優化版)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0c0d12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            padding: 20px;
        }
        
        /* 16:9 畫布容器 */
        .canvas-container {
            width: 100%;
            max-width: 1100px;
            max-height: 62vh; 
            aspect-ratio: 16 / 9;
            background: #040508;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #20222e;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: auto; 
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 現代化高質感雙區塊控制面板 */
        .controls {
            width: 100%;
            max-width: 1100px;
            background: #131520;
            border: 1px solid #282a3a;
            padding: 20px 24px;
            border-radius: 14px;
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 24px;
            margin-top: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        
        .controls.pure-mode {
            display: none !important;
        }

        /* 左側大區塊 */
        .control-left {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 左上：文字與顏色輸入列 */
        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 14px;
            font-size: 14px;
            border: 1px solid #282a3a;
            background: #090a10;
            color: #fff;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* 圓形色彩選擇器 */
        .color-picker-wrapper {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #282a3a;
            overflow: hidden;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, border-color 0.2s;
        }
        .color-picker-wrapper:hover {
            border-color: #4b5563;
            transform: scale(1.05);
        }
        input[type="color"] {
            position: absolute;
            top: -5px;
            left: -5px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            border: none;
            background: transparent;
        }

        /* 左下：附加選項區 */
        .options-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a0a5c0;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        .checkbox-label:hover {
            color: #fff;
        }
        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #3b82f6;
            cursor: pointer;
        }

        /* 右側大區塊 */
        .control-right {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            border-left: 1px solid #222435;
            padding-left: 24px;
        }

        /* 速度調節列 */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1c1e2e;
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #282a3a;
            color: #a0a5c0;
            font-size: 14px;
        }
        input[type="range"] {
            cursor: pointer;
            flex: 1;
            accent-color: #3b82f6;
        }
        .speed-label {
            font-weight: 500;
            color: #8e94b1;
            white-space: nowrap;
        }
        #speedValue {
            font-family: monospace;
            font-weight: bold;
            color: #3b82f6;
            background: #090a10;
            padding: 2px 8px;
            border-radius: 4px;
            text-align: center;
            min-width: 38px;
        }

        /* 按鈕動作列 */
        .action-row {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        button {
            flex: 1;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s, border-color 0.2s;
            white-space: nowrap;
            text-align: center;
        }
        button:active {
            transform: scale(0.98);
        }
        
        .play-btn {
            background: #2563eb;
            color: white;
            flex: 1.2;
        }
        .play-btn:hover {
            background: #1d4ed8;
        }

        .share-btn {
            background: #2d3548;
            color: #e5e7eb;
            border: 1px solid #3f485e;
        }
        .share-btn:hover {
            background: #3f485e;
        }
        .share-btn.copied {
            background: #10b981;
            border-color: #10b981;
            color: white;
        }

        .record-btn {
            background: #dc2626;
            color: white;
        }
        .record-btn:hover {
            background: #b91c1c;
        }
        button.recording {
            background: #ea580c;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        @media (max-width: 900px) {
            body {
                overflow-y: auto;
                justify-content: center;
            }
            .controls {
                grid-template-columns: 1fr;
                gap: 16px;
                padding: 16px;
            }
            .control-right {
                border-left: none;
                padding-left: 0;
                gap: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <canvas id="marbleCanvas"></canvas>
    </div>

    <div class="controls" id="controlPanel">
        <div class="control-left">
            <div class="input-row">
                <div class="color-picker-wrapper" title="更換文字顏色">
                    <input type="color" id="textColorPicker" value="#ff9f43">
                </div>
                <input type="text" id="textInput" value="限時特賣 12345678" placeholder="請輸入跑馬燈文字...">
            </div>
            <div class="options-row">
                <label class="checkbox-label">
                    <input type="checkbox" id="addDateCheckbox">
                    <span>訊息末尾自動加入當天日期、星期</span>
                </label>
            </div>
        </div>
        
        <div class="control-right">
            <div class="slider-row">
                <span class="speed-label">流動速度</span>
                <input type="range" id="speedSlider" min="1" max="20" step="0.5" value="8">
                <span id="speedValue">8.0</span>
            </div>

            <div class="action-row">
                <button id="renderBtn" class="play-btn">開始流動</button>
                <button id="shareBtn" class="share-btn">分享連結</button>
                <button id="recordBtn" class="record-btn">錄影下載</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('marbleCanvas');
        const ctx = canvas.getContext('2d');
        const textInput = document.getElementById('textInput');
        const renderBtn = document.getElementById('renderBtn');
        const recordBtn = document.getElementById('recordBtn');
        const shareBtn = document.getElementById('shareBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const textColorPicker = document.getElementById('textColorPicker');
        const addDateCheckbox = document.getElementById('addDateCheckbox');
        const controlPanel = document.getElementById('controlPanel');

        const MATRIX_ROWS = 32; 
        let MATRIX_COLS = 0; 
        let ballRadius = 0;   

        const COLOR_BG = '#1e272e'; 
        const COLOR_BG_GLOW = '#485460';   

        let currentTextColor = '#ff9f43';
        let currentTextColorGlow = '#fff2cc';
        let currentTextColorShadow = '#662c00';

        let marbles = [];     
        let animationFrameId = null;
        let currentFrame = 0;
        
        let isMarqueePhase = false; 
        let marqueeDelayCounter = 0; 
        const PAUSE_FRAMES = 30;    

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let totalStreamCols = 0;

        textColorPicker.addEventListener('input', (e) => {
            updatePalette(e.target.value);
        });

        function updatePalette(hexColor) {
            currentTextColor = hexColor;
            let r = parseInt(hexColor.slice(1, 3), 16);
            let g = parseInt(hexColor.slice(3, 5), 16);
            let b = parseInt(hexColor.slice(5, 7), 16);

            let nr = Math.min(255, Math.floor(r + (255 - r) * 0.7));
            let ng = Math.min(255, Math.floor(g + (255 - g) * 0.7));
            let nb = Math.min(255, Math.floor(b + (255 - b) * 0.7));
            currentTextColorGlow = `rgb(${nr}, ${ng}, ${nb})`;

            let dr = Math.max(0, Math.floor(r * 0.4));
            let dg = Math.max(0, Math.floor(g * 0.4));
            let db = Math.max(0, Math.floor(b * 0.4));
            currentTextColorShadow = `rgb(${dr}, ${dg}, ${db})`;
        }

        speedSlider.addEventListener('input', (e) => {
            let val = parseFloat(e.target.value);
            speedValue.textContent = val.toFixed(1);
        });

        // 📅 拿掉括號的純淨版日期時間字串
        function getFormattedDateString() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const dayNames = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const dayName = dayNames[now.getDay()];
            return ` ${month}/${date} ${dayName}`;
        }

        class MarqueeMarble {
            constructor(gridX, gridY, isText, targetX, targetY, enterDelay, speed) {
                this.gridX = gridX;
                this.gridY = gridY;
                this.isText = isText;
                this.targetX = targetX;
                this.targetY = targetY;
                this.x = canvas.width + ballRadius * 2 + gridX * (ballRadius * 2);
                this.y = targetY;
                this.enterDelay = enterDelay; 
                this.speed = speed;
                this.hasArrivedPhase1 = false;
            }

            update(frame, globalSpeed) {
                if (!isMarqueePhase) {
                    if (frame >= this.enterDelay && this.x > this.targetX) {
                        this.x -= this.speed;
                        if (this.x <= this.targetX) {
                            this.x = this.targetX;
                            this.hasArrivedPhase1 = true;
                        }
                    } else if (this.x <= this.targetX) {
                        this.hasArrivedPhase1 = true;
                    }
                } else {
                    this.x -= globalSpeed;
                }
            }

            draw() {
                if (this.x > canvas.width + ballRadius || this.x < -ballRadius) return;

                ctx.beginPath();
                ctx.arc(this.x, this.y, ballRadius * 0.90, 0, Math.PI * 2);

                let gradient = ctx.createRadialGradient(
                    this.x - ballRadius * 0.2, this.y - ballRadius * 0.2, ballRadius * 0.05,
                    this.x, this.y, ballRadius
                );

                if (this.isText) {
                    gradient.addColorStop(0, currentTextColorGlow);
                    gradient.addColorStop(0.3, currentTextColor);
                    gradient.addColorStop(1, currentTextColorShadow);
                } else {
                    gradient.addColorStop(0, COLOR_BG_GLOW);
                    gradient.addColorStop(0.4, COLOR_BG);
                    gradient.addColorStop(1, '#0b0f12');
                }

                ctx.fillStyle = gradient;
                ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
                ctx.shadowBlur = 1.5;
                ctx.shadowOffsetX = 1;
                ctx.shadowOffsetY = 1;
                ctx.fill();
                ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
            }
        }

        function resizeCanvas() {
            const container = document.querySelector('.canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            canvas.width = width;
            canvas.height = height;

            ballRadius = height / MATRIX_ROWS / 2;
            MATRIX_COLS = Math.floor(width / (ballRadius * 2));
        }

        // 🚀 核心升級：具備「動態字元邊界裁切（壓縮間距）」的點陣生成引擎
        function generateCompactDynamicMatrix(text) {
            const size = 32;
            const singleCanvas = document.createElement('canvas');
            const singleCtx = singleCanvas.getContext('2d');
            singleCanvas.width = size;
            singleCanvas.height = size;
            
            let finalMatrix = Array.from({ length: size }, () => []);

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                
                // 清空畫布準備繪製單一字元
                singleCtx.fillStyle = '#000';
                singleCtx.fillRect(0, 0, size, size);
                
                singleCtx.font = `bold 30px "PMingLiU", "MingLiU", "SimSun", "Songti TC", "Arial", sans-serif`;
                singleCtx.textBaseline = 'middle';
                singleCtx.textAlign = 'center';
                singleCtx.fillStyle = '#fff';
                singleCtx.fillText(char, size / 2, (size / 2) + 1);

                const imgData = singleCtx.getImageData(0, 0, size, size);
                const data = imgData.data;

                // 提取這個字元的 32x32 布林陣列
                let charGrid = Array.from({ length: size }, () => []);
                for (let y = 0; y < size; y++) {
                    for (let x = 0; x < size; x++) {
                        const idx = (y * size + x) * 4;
                        charGrid[y].push(data[idx] > 120 ? 1 : 0);
                    }
                }

                // 🧐 掃描該字元的實體點陣邊界 (左邊界與右邊界)
                let minX = size;
                let maxX = 0;
                let hasPixels = false;

                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {
                        if (charGrid[y][x] === 1) {
                            if (x < minX) minX = x;
                            if (x > maxX) maxX = x;
                            hasPixels = true;
                        }
                    }
                }

                // 核心裁切邏輯
                let startCol = 0;
                let endCol = size - 1;

                // 如果是空白字元，給予固定的窄間距
                if (!hasPixels) {
                    startCol = 0;
                    endCol = 10; 
                } else {
                    // 如果是英數字或標點（通常左右留白極多），進行精確裁切，並補上 1 像素安全中斷點
                    const charCode = char.charCodeAt(0);
                    const isFullWidth = charCode > 255; // 判斷是否為中文字/全形
                    
                    if (!isFullWidth) {
                        startCol = Math.max(0, minX - 1);
                        endCol = Math.min(size - 1, maxX + 1);
                    }
                    // 全形中文字則維持原寬度不變，保留霸氣排版
                }

                // 將裁切後的局部欄位合併到最終的總矩陣中
                for (let y = 0; y < size; y++) {
                    for (let x = startCol; x <= endCol; x++) {
                        finalMatrix[y].push(charGrid[y][x]);
                    }
                }
            }
            return finalMatrix;
        }

        function buildScene() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            marbles = [];
            currentFrame = 0;
            isMarqueePhase = false;
            marqueeDelayCounter = 0;

            let finalOutputText = textInput.value || " ";
            if (addDateCheckbox.checked) {
                finalOutputText += getFormattedDateString();
            }

            // 改用緊湊型字元矩陣生成器
            const textMatrix = generateCompactDynamicMatrix(finalOutputText);
            const totalTextPixelsWidth = textMatrix[0].length;

            const firstTwoWordsWidth = Math.min(64, totalTextPixelsWidth);
            const startX = Math.floor((MATRIX_COLS - firstTwoWordsWidth) / 2);

            totalStreamCols = startX + totalTextPixelsWidth + 4;

            for (let y = 0; y < MATRIX_ROWS; y++) {
                for (let x = 0; x < totalStreamCols; x++) {
                    
                    let isText = false;
                    if (x >= startX && x < startX + totalTextPixelsWidth) {
                        isText = textMatrix[y][x - startX] === 1;
                    }

                    const targetX = x * (ballRadius * 2) + ballRadius;
                    const targetY = y * (ballRadius * 2) + ballRadius;

                    const enterDelay = y * 3; 
                    const initialSpeed = 22;  

                    marbles.push(new MarqueeMarble(x, y, isText, targetX, targetY, enterDelay, initialSpeed));
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#040508';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (!isMarqueePhase) {
                    const screenMarbles = marbles.filter(m => m.gridX < MATRIX_COLS);
                    const allArrived = screenMarbles.every(m => m.hasArrivedPhase1);
                    
                    if (allArrived) {
                        marqueeDelayCounter++;
                        if (marqueeDelayCounter >= PAUSE_FRAMES) {
                            isMarqueePhase = true; 
                        }
                    }
                }

                const currentMarqueeSpeed = parseFloat(speedSlider.value);

                marbles.forEach(marble => {
                    marble.update(currentFrame, currentMarqueeSpeed);
                    marble.draw();
                });

                if (isRecording && isMarqueePhase) {
                    const lastMarble = marbles[marbles.length - 1];
                    if (lastMarble && lastMarble.x < -ballRadius) {
                        stopRecording();
                    }
                }

                currentFrame++;
                animationFrameId = requestAnimationFrame(animate);
            }

            animate();
        }

        // 錄影下載
        function startRecording() {
            if (isRecording) return;
            isRecording = true;
            recordedChunks = [];

            recordBtn.textContent = "錄影中...";
            recordBtn.classList.add('recording');

            const stream = canvas.captureStream(30);
            let options = { mimeType: 'video/webm;codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm;codecs=vp8' };
            }

            mediaRecorder = new MediaRecorder(stream, options);
            
            mediaRecorder.ondataavailable = (e) => {
                if (e.data && e.data.size > 0) {
                    recordedChunks.push(e.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `marble_marquee_compact_${new Date().getTime()}.webm`;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);

                recordBtn.textContent = "錄影下載";
                recordBtn.classList.remove('recording');
                isRecording = false;
            };

            buildScene();
            mediaRecorder.start();
        }

        function stopRecording() {
            if (!isRecording) return;
            mediaRecorder.stop();
        }

        // 產生分享連結
        function generateShareLink() {
            const textValue = encodeURIComponent(textInput.value);
            const speedValue = speedSlider.value;
            const colorValue = textColorPicker.value.replace('#', '');
            const showDateValue = addDateCheckbox.checked ? "1" : "0";
            
            const baseUrl = window.location.origin + window.location.pathname;
            const shareUrl = `${baseUrl}?msg=${textValue}&speed=${speedValue}&color=${colorValue}&showDate=${showDateValue}`;

            navigator.clipboard.writeText(shareUrl).then(() => {
                shareBtn.textContent = "已複製！";
                shareBtn.classList.add('copied');
                
                setTimeout(() => {
                    shareBtn.textContent = "分享連結";
                    shareBtn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert("網址為：\n" + shareUrl);
            });
        }

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const msg = urlParams.get('msg');
            const speed = urlParams.get('speed');
            const color = urlParams.get('color');
            const showDate = urlParams.get('showDate');

            if (color) {
                const hexColor = '#' + color;
                textColorPicker.value = hexColor;
                updatePalette(hexColor);
            } else {
                updatePalette(textColorPicker.value);
            }

            if (showDate) {
                addDateCheckbox.checked = (showDate === "1");
            }

            if (msg) {
                textInput.value = decodeURIComponent(msg);
                if (speed) {
                    speedSlider.value = speed;
                    speedValue.textContent = parseFloat(speed).toFixed(1);
                }
                
                controlPanel.classList.add('pure-mode');
                document.body.style.padding = "0"; 
                
                const container = document.querySelector('.canvas-container');
                container.style.maxHeight = '100vh';
                container.style.border = 'none';
                container.style.borderRadius = '0';
                container.style.boxShadow = 'none';
                
                resizeCanvas();
                buildScene();
            } else {
                resizeCanvas();
                ctx.fillStyle = '#040508';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            buildScene();
        });

        renderBtn.addEventListener('click', buildScene);
        recordBtn.addEventListener('click', startRecording);
        shareBtn.addEventListener('click', generateShareLink);
        
        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') buildScene();
        });

        checkUrlParams();
    </script>
</body>
</html>
